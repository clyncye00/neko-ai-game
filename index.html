<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5cf"><meta name="description" content="AI画像に、また猫。猫だけタップして修正する20秒のミニゲーム。">
<title>猫、混ざってます。</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script defer src="engine.js"></script><script defer src="game.js"></script>
</head>
<body>
<main class="app" id="app">
  <header><div class="brand">ねこまじりAI <span class="badge">猫の混入率、ほぼ100％</span></div><div class="title-row"><div><p class="kicker">＼ AIさん、またですか！ ／</p><h1>猫、<br>混ざってます<span>。</span></h1></div><div class="mascot" aria-hidden="true"><span class="mascot-note">猫ゼロです。<small>（大うそ）</small></span><span class="mascot-face">😼</span><span class="mascot-tag">自称・高性能AI</span></div></div><p class="tagline">まぎれた猫を、タップでぽいっ！</p></header>
  <section class="dashboard" aria-label="ゲームの成績"><div><span class="label">修正スコア</span><strong id="score">0</strong></div><div class="combo"><span class="label" id="combo-label">猫だけ連続で</span><strong id="combo">×1</strong></div><div class="timer"><span class="label">のこり</span><strong><span id="time">20</span><small>秒</small></strong></div></section>
  <div class="time-track" aria-hidden="true"><div id="time-fill"></div></div>
  <section class="workspace" aria-label="AIが生成した画像">
    <div class="prompt"><span class="you">お題</span><p id="prompt"></p><span class="prompt-rule">※ 猫は入れないで。</span></div>
    <div class="canvas-top"><span id="status">タップで20秒スタート</span><span id="remaining">猫 3 匹</span></div>
    <div class="grid" id="grid" aria-label="猫だけをタップして修正"></div>
    <div class="canvas-bottom"><span id="progress-label">修正待ち</span><span id="feedback" aria-live="polite">猫だけタップ！ 猫以外はそのまま。</span></div>
  </section>
  <aside class="ai-chat" aria-live="polite"><span class="ai-avatar" aria-hidden="true">😼</span><div><span class="ai-name">ねこまじりAI</span><p id="excuse">猫は入れていません。たぶん。</p></div></aside>
  <p class="instruction" id="instruction">🐱 猫を消すと加点。猫以外は −20点。</p>
  <section class="result" id="result" hidden aria-labelledby="result-title"><div class="result-trophy" aria-hidden="true">🏆<span>🐱</span></div><p class="result-kicker">20秒のおしごと、おつかれさま。</p><h2 id="result-title" tabindex="-1"></h2><p class="result-score"><span id="final-score">0</span><small>点</small></p><p id="result-stats"></p><div class="report"><span>AIからの最終報告</span><p id="report"></p></div><button class="retry" id="retry" type="button">もう一度、修正する <span aria-hidden="true">↻</span></button></section>
  <footer>このAIは演出です。猫への愛は本物です。</footer>
</main>
</body></html>
